# Modified for DuoFlow; see NOTICE.md.
[project]
name = "duoflow"
version = "0.1.0"
description = "Joint speech and co-speech motion generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "motionspeech-core",
    "motionspeech-trainer",
    "diffusers>=0.35.0",
    "librosa>=0.10.2",
    "ftfy>=6.2",
    "regex>=2024.11",
    "packaging>=24.2",
    "phonemizer>=3.3.0",
    "pyrender>=0.1.45",
    "pyyaml>=6.0.2",
    "smplx>=0.1.28",
    "soundfile>=0.13.1",
    "trimesh>=4.8.0",
]

[tool.uv.sources]
motionspeech-core = { workspace = true }
motionspeech-trainer = { workspace = true }

[tool.uv.workspace]
members = ["packages/motionspeech-core", "packages/motionspeech-trainer"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
    "pytest~=9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = []

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "W", # pycodestyle (warnings)
    "I", # isort
    "N", # pep8-naming
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EXE", # flake8-executable
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT", # flake8-pytest
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8--use-pathlib
    "ERA", # flake8-eradicate
    "RUF", # ruff specific rules
    "PL", # pylint
]
ignore = [
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
    "ANN204", # Missing type annotation for special method
    "COM812", # Missing trailing comma
    "PTH123", # `open()` should be replaced by `Path.open()`
    "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
    "N812", # Lowercase  imported as non-lowercase
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
known-first-party = ["motionspeech_core", "motionspeech_trainer"]
