model:
  inputdim: 333
  hidden_size: 2048
  down_t: 1
  stride_t: 3
  depth: 3
  dilation_growth_rate: 3
  activation: relu
  latent_dim: 64
  clip_range: [-30, 20]
training:
  batch_size: 64
  window_size: 63
  max_steps: 2000000
  learning_rate: 0.00005
  betas: [0.9, 0.99]
  weight_decay: 0.0
  warmup_steps: 1000
  milestones: [1900000]
  gamma: 0.05
  root_weight: 7.0
  kl_weight: 1.0
  save_every: 10000
  seed: 123
