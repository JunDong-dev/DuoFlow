# Modified for DuoFlow; see NOTICE.md.
[project]
name = "motionspeech-trainer"
version = "1.0.0"
description = "Training pipeline for DuoFlow"
requires-python = ">=3.10"
dependencies = [
    "motionspeech-core",
    "accelerate>=1.2.1",
    "av>=14.2.1",
    "bitsandbytes >=0.45.2; sys_platform == 'linux'",
    "huggingface-hub[hf-xet]>=0.31.4",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "optimum-quanto>=0.2.6",
    "peft>=0.14.0",
    "pydantic>=2.10.4",
    "rich>=13.9.4",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.0",
    "torch>=2.5,<3",
    "torchaudio>=2.5,<3",
    "torchvision>=0.20,<1",
    "typer>=0.15.1",
    "tensorboard>=2.18",
    "wandb>=0.19.11",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "ruff>=0.8.6",
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]



[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "W", # pycodestyle (warnings)
    "I", # isort
    "N", # pep8-naming
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EXE", # flake8-executable
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT", # flake8-pytest
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8--use-pathlib
    "ERA", # flake8-eradicate
    "RUF", # ruff specific rules
    "PL", # pylint
]
ignore = [
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
    "ANN204", # Missing type annotation for special method
    "COM812", # Missing trailing comma
    "PTH123", # `open()` should be replaced by `Path.open()`
    "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
]
[tool.ruff.lint.pylint]
max-args = 10
[tool.ruff.lint.isort]
known-first-party = ["motionspeech_trainer", "motionspeech_core"]
