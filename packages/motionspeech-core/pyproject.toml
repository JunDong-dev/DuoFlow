# Modified for DuoFlow; see NOTICE.md.
[project]
name = "motionspeech-core"
version = "1.0.0"
description = "Core model components for DuoFlow"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<3",
    "torchaudio>=2.5,<3",
    "einops",
    "numpy",
    "transformers",
    "safetensors",
    "accelerate",
    "scipy>=1.14",
]

[project.optional-dependencies]
xformers = ["xformers"]


[tool.uv.sources]
xformers = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "scikit-image>=0.25.2",
]
